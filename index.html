<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Notepad">
  <meta name="theme-color" content="#111111">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Phrase screen (homepage) ---------- */
    .phrase-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #1a1a1a;
      z-index: 10;
    }

    .phrase-title {
      font-size: 16px;
      font-weight: normal;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .phrase-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    .phrase-input {
      background: #111;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 12px 16px;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    .phrase-input:focus { border-color: #f4c430; }

    .phrase-enter {
      background: none;
      border: 1px solid #f4c430;
      color: #f4c430;
      padding: 12px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.15s;
    }

    .phrase-enter:hover {
      background: #f4c430;
      color: #000;
    }

    .phrase-enter:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .phrase-error {
      color: #e74c3c;
      font-size: 12px;
      min-height: 16px;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ---------- App chrome ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      font-size: 16px;
      font-weight: normal;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .page-info {
      font-size: 12px;
      color: #555;
      min-width: 60px;
      text-align: right;
    }

    .word-count {
      font-size: 12px;
      color: #555;
    }

    .sync-status {
      font-size: 11px;
      color: #555;
      min-width: 70px;
    }

    .sync-status.error { color: #c0392b; }
    .sync-status.ok { color: #4a7c4a; }

    button {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
      font-family: inherit;
    }

    button:hover {
      border-color: #666;
      color: #ccc;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button.danger:hover {
      border-color: #c0392b;
      color: #e74c3c;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .container {
      flex: 1;
      overflow: auto;
      padding: 48px;
    }

    .content {
      max-width: 900px;
      line-height: 1.8;
      font-size: 15px;
      min-height: 100%;
      outline: none;
    }

    @media (max-width: 768px) {
      .container { padding: 24px; }
      header { padding: 10px 14px; }
      header h1 { font-size: 13px; letter-spacing: 1px; }
      .actions { gap: 6px; }
      .sync-status { display: none; }
      button { padding: 4px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="phrase-screen" id="phraseScreen">
  <div class="phrase-title">Notepad</div>
  <form class="phrase-form" id="phraseForm" autocomplete="off">
    <input class="phrase-input" type="password" id="phraseInput" autocomplete="off" spellcheck="false" autocapitalize="off" autofocus>
    <button class="phrase-enter" type="submit" id="enterBtn">Enter</button>
    <div class="phrase-error" id="phraseError"></div>
  </form>
</div>

<header id="appHeader" hidden>
  <h1>Notepad</h1>
  <div class="actions">
    <span class="sync-status" id="syncStatus"></span>
    <span class="word-count" id="wordCount">0 words</span>
    <div class="nav-buttons">
      <button id="prevBtn">← Prev</button>
      <span class="page-info" id="pageInfo">1 / 1</span>
      <button id="nextBtn">Next →</button>
    </div>
    <button id="lockBtn">Lock</button>
    <button class="danger" id="clearBtn">Clear</button>
  </div>
</header>

<div class="container" id="appContainer" hidden>
  <div class="content" id="editor" contenteditable="true"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import DOMPurify from 'https://esm.sh/dompurify@3';

  // Public anon-key — RLS allows public access; encryption is the privacy layer.
  const SUPABASE_URL = 'https://myiwtcnbfftknjeppnmd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_mTkd28TZMHaADZc7vEVM3Q_pyMNA72o';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const KEY_SALT = 'notepad-key-v1';
  const ID_SALT = 'notepad-id-v1';
  const PBKDF2_ITERS = 100000;

  // ---------------------------------------------------------------------------
  // CRYPTO — AES-GCM-256 with PBKDF2-derived key. 128-bit security level.
  // ---------------------------------------------------------------------------
  async function deriveKey(phrase) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: enc.encode(KEY_SALT),
        iterations: PBKDF2_ITERS,
        hash: 'SHA-256'
      },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function deriveId(phrase) {
    const buf = await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(phrase + ID_SALT)
    );
    return [...new Uint8Array(buf)]
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  async function encryptJSON(cryptoKey, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      cryptoKey,
      new TextEncoder().encode(JSON.stringify(obj))
    );
    const combined = new Uint8Array(iv.length + ciphertext.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ciphertext), iv.length);
    let bin = '';
    for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return btoa(bin);
  }

  async function decryptJSON(cryptoKey, b64) {
    const bin = atob(b64);
    const combined = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) combined[i] = bin.charCodeAt(i);
    const iv = combined.slice(0, 12);
    const data = combined.slice(12);
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      cryptoKey,
      data
    );
    return JSON.parse(new TextDecoder().decode(plaintext));
  }

  // ---------------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------------
  const phraseScreen = document.getElementById('phraseScreen');
  const phraseForm = document.getElementById('phraseForm');
  const phraseInput = document.getElementById('phraseInput');
  const phraseError = document.getElementById('phraseError');
  const enterBtn = document.getElementById('enterBtn');
  const appHeader = document.getElementById('appHeader');
  const appContainer = document.getElementById('appContainer');
  const editor = document.getElementById('editor');
  const wordCount = document.getElementById('wordCount');
  const pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const lockBtn = document.getElementById('lockBtn');
  const clearBtn = document.getElementById('clearBtn');
  const syncStatus = document.getElementById('syncStatus');

  // ---------------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------------
  let cryptoKey = null;
  let phraseId = null;
  let pages = { 1: '' };
  let currentPage = 1;
  let pushTimer = null;
  let autoSaveTimer = null;

  // ---------------------------------------------------------------------------
  // LOCAL PERSISTENCE (encrypted)
  // ---------------------------------------------------------------------------
  async function saveLocal() {
    if (!cryptoKey || !phraseId) return;
    try {
      const blob = await encryptJSON(cryptoKey, { pages, currentPage });
      localStorage.setItem('notepad-data', blob);
      localStorage.setItem('notepad-id', phraseId);
    } catch (e) {
      console.error('saveLocal', e);
    }
  }

  async function loadLocal() {
    if (!cryptoKey || !phraseId) return null;
    if (localStorage.getItem('notepad-id') !== phraseId) return null;
    const blob = localStorage.getItem('notepad-data');
    if (!blob) return null;
    try {
      return await decryptJSON(cryptoKey, blob);
    } catch {
      return null;
    }
  }

  function wipeLocal() {
    localStorage.removeItem('notepad-data');
    localStorage.removeItem('notepad-id');
    // Clear legacy keys from earlier versions
    localStorage.removeItem('notepad-pages');
    localStorage.removeItem('notepad-last-page');
    localStorage.removeItem('notepad-dirty');
  }

  // ---------------------------------------------------------------------------
  // CLOUD SYNC
  // ---------------------------------------------------------------------------
  async function pullCloud() {
    if (!cryptoKey || !phraseId) return null;
    const { data, error } = await supabase
      .from('notes')
      .select('encrypted')
      .eq('id', phraseId)
      .maybeSingle();
    if (error) {
      setSyncStatus('error', error.message);
      return null;
    }
    if (!data?.encrypted) return null;
    try {
      return await decryptJSON(cryptoKey, data.encrypted);
    } catch {
      throw new Error('decrypt-fail');
    }
  }

  async function pushCloud() {
    if (!cryptoKey || !phraseId) return;
    setSyncStatus('pending', 'Saving…');
    try {
      const blob = await encryptJSON(cryptoKey, { pages, currentPage });
      const { error } = await supabase.from('notes').upsert({
        id: phraseId,
        encrypted: blob,
        updated_at: new Date().toISOString()
      });
      if (error) {
        setSyncStatus('error', error.message);
        return;
      }
      setSyncStatus('ok', 'Synced');
    } catch (e) {
      setSyncStatus('error', e.message);
    }
  }

  function queuePush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushCloud, 1000);
  }

  function setSyncStatus(kind, text) {
    syncStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
    syncStatus.textContent = text || '';
    if (kind === 'ok') {
      const captured = text;
      setTimeout(() => {
        if (syncStatus.textContent === captured) {
          syncStatus.textContent = '';
          syncStatus.className = 'sync-status';
        }
      }, 1500);
    }
  }

  // ---------------------------------------------------------------------------
  // EDITOR / NAVIGATION
  // ---------------------------------------------------------------------------
  function reloadEditor() {
    if (!pages[currentPage]) {
      const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
      currentPage = nums[0] || 1;
      if (!pages[currentPage]) pages[currentPage] = '';
    }
    editor.innerHTML = DOMPurify.sanitize(pages[currentPage] || '');
    updateWordCount();
    updateUI();
  }

  function loadPage(page) {
    pages[currentPage] = editor.innerHTML;
    Object.keys(pages).forEach(p => {
      const n = parseInt(p);
      if (n > 1 && (!pages[p] || pages[p].trim() === '')) delete pages[p];
    });
    currentPage = page;
    editor.innerHTML = DOMPurify.sanitize(pages[currentPage] || '');
    updateWordCount();
  }

  function updateUI() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    pageInfo.textContent = `${currentPage} / ${nums.length}`;
    prevBtn.disabled = nums.indexOf(currentPage) <= 0;
  }

  function nextPage() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    const idx = nums.indexOf(currentPage);
    if (idx < nums.length - 1) {
      savePage();
      loadPage(nums[idx + 1]);
    } else {
      const newPage = (nums.length ? Math.max(...nums) : 0) + 1;
      pages[newPage] = '';
      savePage();
      loadPage(newPage);
    }
    updateUI();
    editor.focus();
  }

  function prevPage() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    const idx = nums.indexOf(currentPage);
    if (idx > 0) {
      savePage();
      loadPage(nums[idx - 1]);
      updateUI();
      editor.focus();
    }
  }

  function clearPage() {
    if (editor.innerHTML && confirm('Clear this page?')) {
      editor.innerHTML = '';
      savePage();
      updateWordCount();
    }
  }

  function savePage() {
    pages[currentPage] = editor.innerHTML;
    saveLocal();
    queuePush();
  }

  function updateWordCount() {
    const text = editor.textContent.trim();
    const words = text ? text.split(/\s+/).length : 0;
    wordCount.textContent = words + (words === 1 ? ' word' : ' words');
  }

  // ---------------------------------------------------------------------------
  // ENTER / LOCK
  // ---------------------------------------------------------------------------
  async function enter(phrase) {
    phraseError.textContent = '';
    enterBtn.disabled = true;
    enterBtn.textContent = 'Working…';

    try {
      cryptoKey = await deriveKey(phrase);
      phraseId = await deriveId(phrase);

      const local = await loadLocal();
      if (local) {
        pages = local.pages || { 1: '' };
        currentPage = local.currentPage || 1;
      }

      let cloud = null;
      try {
        cloud = await pullCloud();
      } catch (e) {
        if (e.message === 'decrypt-fail') {
          throw new Error("Couldn't unlock these notes — phrase doesn't match the stored content.");
        }
        // Network/permission errors fall through; we still allow local-only use.
      }

      if (cloud) {
        pages = cloud.pages || { 1: '' };
        currentPage = cloud.currentPage || 1;
        await saveLocal();
      } else if (!local) {
        pages = { 1: '' };
        currentPage = 1;
        await saveLocal();
      }

      phraseScreen.hidden = true;
      appHeader.hidden = false;
      appContainer.hidden = false;
      reloadEditor();
      editor.focus();
    } catch (e) {
      phraseError.textContent = e.message || 'Something went wrong. Try again.';
      cryptoKey = null;
      phraseId = null;
    } finally {
      enterBtn.disabled = false;
      enterBtn.textContent = 'Enter';
    }
  }

  function lock() {
    if (cryptoKey) savePage();
    cryptoKey = null;
    phraseId = null;
    pages = { 1: '' };
    currentPage = 1;
    appHeader.hidden = true;
    appContainer.hidden = true;
    phraseScreen.hidden = false;
    phraseInput.value = '';
    phraseError.textContent = '';
    setTimeout(() => phraseInput.focus(), 0);
  }

  // ---------------------------------------------------------------------------
  // WIRING
  // ---------------------------------------------------------------------------
  phraseForm.addEventListener('submit', e => {
    e.preventDefault();
    const phrase = phraseInput.value;
    if (!phrase) return;
    enter(phrase);
  });

  prevBtn.addEventListener('click', prevPage);
  nextBtn.addEventListener('click', nextPage);
  clearBtn.addEventListener('click', clearPage);
  lockBtn.addEventListener('click', lock);

  editor.addEventListener('input', () => {
    updateWordCount();
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(savePage, 1000);
  });

  document.addEventListener('keydown', e => {
    if (!cryptoKey) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  });

  let touchStart = 0;
  editor.addEventListener('touchstart', e => { touchStart = e.touches[0].clientX; });
  editor.addEventListener('touchend', e => {
    const end = e.changedTouches[0].clientX;
    if (touchStart - end > 50) nextPage();
    if (end - touchStart > 50) prevPage();
  });

  window.addEventListener('online', () => { if (cryptoKey) queuePush(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

</body>
</html>
