<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notepad</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Notepad">
  <meta name="theme-color" content="#111111">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Phrase screen (homepage) ---------- */
    .phrase-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #1a1a1a;
      z-index: 10;
    }

    .phrase-screen[hidden] { display: none; }

    .phrase-title {
      font-size: 16px;
      font-weight: normal;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .ai-intro {
      font-size: 14px;
      font-style: italic;
      color: #888;
      line-height: 1.5;
      max-width: 360px;
      text-align: center;
      margin-bottom: 28px;
    }

    .phrase-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    .phrase-input-wrap {
      position: relative;
    }

    .phrase-input {
      background: #111;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 12px 44px 12px 16px;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    .phrase-input::placeholder { color: #555; }
    .phrase-input:focus { border-color: #f4c430; }

    .phrase-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .phrase-toggle:hover { color: #ccc; }
    .phrase-toggle:focus-visible { outline: 1px solid #f4c430; outline-offset: 2px; }
    .phrase-toggle svg[hidden] { display: none; }

    .phrase-enter {
      background: none;
      border: none;
      color: #f4c430;
      padding: 12px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: color 0.15s;
    }

    .phrase-enter:hover {
      color: #fff8d6;
    }

    .phrase-enter:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .phrase-error {
      color: #e74c3c;
      font-size: 12px;
      min-height: 16px;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ---------- App chrome ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      padding-top: max(14px, env(safe-area-inset-top));
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 24px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    header h1 {
      font-size: 16px;
      font-weight: normal;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      cursor: text;
      min-width: 80px;
      max-width: 50vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 2px;
      padding: 2px 4px;
      margin: -2px -4px;
      transition: background 0.15s;
    }

    header h1:hover,
    header h1:focus { background: #1a1a1a; }

    header h1:empty::before {
      content: attr(data-placeholder);
      color: #555;
      font-style: italic;
      text-transform: none;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .page-info {
      font-size: 12px;
      color: #555;
      min-width: 60px;
      text-align: right;
      white-space: nowrap;
    }

    .word-count {
      font-size: 12px;
      color: #555;
      white-space: nowrap;
    }

    .sync-status {
      font-size: 11px;
      color: #555;
      min-width: 70px;
    }

    .sync-status.error { color: #c0392b; }
    .sync-status.ok { color: #4a7c4a; }

    button {
      background: none;
      border: none;
      color: #888;
      padding: 5px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: color 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }

    button:hover {
      color: #ccc;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button.danger:hover {
      color: #e74c3c;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #888;
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s;
    }

    .icon-btn:hover { color: #ccc; }
    .icon-btn svg { width: 14px; height: 14px; display: block; }
    .icon-btn.danger:hover { color: #e74c3c; }

    .icon-btn--floating {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      opacity: 0.4;
    }

    .icon-btn--floating:hover,
    .icon-btn--floating:focus-visible { opacity: 1; }

    .container {
      flex: 1;
      overflow: auto;
      padding: 48px;
      position: relative;
    }

    .content {
      max-width: 900px;
      line-height: 1.8;
      font-size: 15px;
      min-height: 100%;
      outline: none;
    }

    /* Cursor-aware ghost placeholder. The data-placeholder attribute is set
       by updateGhost() ONLY on truly-empty blocks (allowing a single <br>
       which browsers insert for cursor positioning) and removed on input,
       so we can trust the attribute alone — no :empty needed. The attribute
       is stripped by cleanForSave() before persistence. */
    .content [data-placeholder]::before,
    .content[data-placeholder]::before {
      content: attr(data-placeholder);
      color: #555;
      font-style: italic;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 768px) {
      .container { padding: 24px; }
      header { padding: 10px 14px; }
      header h1 { font-size: 13px; letter-spacing: 1px; max-width: 40vw; }
      .actions { gap: 6px; }
      .sync-status { display: none; }
      button { padding: 4px 10px; font-size: 12px; }
      .icon-btn { width: 24px; height: 24px; padding: 0; }
      .icon-btn svg { width: 12px; height: 12px; }
      .icon-btn--floating { top: 8px; right: 8px; opacity: 0.6; }
    }
  </style>
</head>
<body>

<div class="phrase-screen" id="phraseScreen">
  <div class="phrase-title">Notepad</div>
  <p class="ai-intro" id="aiIntro"></p>
  <form class="phrase-form" id="phraseForm" autocomplete="off">
    <div class="phrase-input-wrap">
      <input class="phrase-input" type="text" id="phraseInput" placeholder="enter with phrase" autocomplete="off" spellcheck="false" autocapitalize="off" autofocus>
      <button class="phrase-toggle" type="button" id="phraseToggle" aria-label="Hide phrase">
        <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M3 3l18 18"/>
          <path d="M10.5 10.7a2 2 0 0 0 2.8 2.8"/>
          <path d="M9.5 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.2 17.2 0 0 1-2.6 3.4M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-.9"/>
        </svg>
      </button>
    </div>
    <button class="phrase-enter" type="submit" id="enterBtn">Enter</button>
    <div class="phrase-error" id="phraseError"></div>
  </form>
</div>

<header id="appHeader" hidden>
  <h1 id="hint" contenteditable="plaintext-only" spellcheck="false" data-placeholder="hint…"></h1>
</header>

<div class="container" id="appContainer" hidden>
  <button id="clearBtn" class="icon-btn icon-btn--floating danger" type="button" aria-label="Clear this page" title="Clear this page">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M3 6h18"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" x2="10" y1="11" y2="17"/>
      <line x1="14" x2="14" y1="11" y2="17"/>
    </svg>
  </button>
  <div class="content" id="editor" contenteditable="true"></div>
</div>

<footer id="appFooter" hidden>
  <div class="actions">
    <span class="sync-status" id="syncStatus"></span>
    <span class="word-count" id="wordCount">0 words</span>
    <div class="nav-buttons">
      <button id="prevBtn">← Prev</button>
      <span class="page-info" id="pageInfo">1 / 1</span>
      <button id="nextBtn">Next →</button>
    </div>
    <button id="switchBtn" class="icon-btn" type="button" aria-label="Switch notepad" title="Switch notepad">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m2 9 3-3 3 3"/>
        <path d="M13 18H7a2 2 0 0 1-2-2V6"/>
        <path d="m22 15-3 3-3-3"/>
        <path d="M11 6h6a2 2 0 0 1 2 2v10"/>
      </svg>
    </button>
  </div>
</footer>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import DOMPurify from 'https://esm.sh/dompurify@3';

  // Public anon-key — RLS allows public access; encryption is the privacy layer.
  const SUPABASE_URL = 'https://myiwtcnbfftknjeppnmd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_mTkd28TZMHaADZc7vEVM3Q_pyMNA72o';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Retire legacy state from v3/v4: encrypted localStorage blob, Service Worker,
  // and the caches the old SW populated. If we found a SW (from any prior version),
  // the page we're rendering may have come from its cache — force one reload to
  // guarantee fresh bytes from the network. The sessionStorage flag prevents loops.
  (async () => {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs.length) {
        await Promise.all(regs.map(r => r.unregister()));
        if ('caches' in window) {
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }
        if (!sessionStorage.getItem('notepad-sw-cleanup')) {
          sessionStorage.setItem('notepad-sw-cleanup', '1');
          window.location.reload();
          return;
        }
      } else if ('caches' in window) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    }
  })();
  ['notepad-data', 'notepad-id', 'notepad-pages', 'notepad-last-page', 'notepad-dirty']
    .forEach(k => localStorage.removeItem(k));

  const KEY_SALT = 'notepad-key-v1';
  const ID_SALT = 'notepad-id-v1';
  const PBKDF2_ITERS = 100000;

  // ---------------------------------------------------------------------------
  // AI VOICE — short and sharp as a pocket knife of a ninja-gangster.
  // Quiet menace, dry confidence. Every line is a cut. Static copy; no LLM
  // calls, no network. Roasts the blank page, never the writer.
  //
  // Lines are tagged by context (time-of-day + day-of-week). aiContext()
  // resolves the user's local clock to tags; pickByContext() picks tagged
  // lines first, falling back to untagged defaults. AI.refresh() recomputes
  // the cached picks at each unlock + switch so a new session gets new lines.
  // ---------------------------------------------------------------------------
  const POOL = {
    intros: [
      { tags: [], line: "One phrase locks everything. Forget it, the words go with it." },
      { tags: ['late-night'], line: "It's late. One phrase locks the page. Forget it, the night takes the words." },
      { tags: ['early-morning'], line: "Up early. One phrase locks it. Forget it, the day starts clean without you." },
      { tags: ['morning'], line: "Morning. One phrase locks the page. Forget it, the day starts clean." },
      { tags: ['evening'], line: "Evening. One phrase locks it. Forget it, the page goes dark." },
      { tags: ['night'], line: "Late again. One phrase locks the page. Forget it, the words sleep with you." },
      { tags: ['monday'], line: "Monday already. One phrase locks the week down. Forget it, the week stays yours." },
      { tags: ['friday'], line: "Friday. One phrase locks the page. Forget it tonight, it stays gone." },
      { tags: ['weekend'], line: "Weekend. One phrase locks the page. Forget it, no one remembers." },
    ],
    firstPrompts: [
      { tags: [], line: "What's it gonna be?" },
      { tags: ['late-night'], line: "What's keeping you up?" },
      { tags: ['early-morning'], line: "First thought. Go." },
      { tags: ['morning'], line: "Morning. What's first?" },
      { tags: ['afternoon'], line: "Afternoon. Out with it." },
      { tags: ['evening'], line: "Evening. What's loud?" },
      { tags: ['night'], line: "Night. Talk to me." },
      { tags: ['monday'], line: "Monday. What's the move?" },
      { tags: ['friday'], line: "Friday. What's left to say?" },
      { tags: ['weekend'], line: "Weekend. What's on your mind?" },
    ],
    rowPlaceholders: [
      { tags: [], line: "Words. Now." },
      { tags: [], line: "Make it count." },
      { tags: [], line: "Plot twist?" },
      { tags: [], line: "Stop thinking. Type." },
      { tags: [], line: "Surprise me." },
      { tags: [], line: "Less staring, more typing." },
      { tags: ['late-night'], line: "Late writes hit different." },
      { tags: ['late-night'], line: "Insomnia? Spill it." },
      { tags: ['late-night'], line: "Past midnight. Speak." },
      { tags: ['early-morning'], line: "Coffee and consequences." },
      { tags: ['early-morning'], line: "First thought. Go." },
      { tags: ['morning'], line: "Morning, killer." },
      { tags: ['morning'], line: "Day's edge. Write." },
      { tags: ['afternoon'], line: "Lunch over. Type." },
      { tags: ['afternoon'], line: "Mid-day, mid-thought." },
      { tags: ['evening'], line: "Evening light. Type slow." },
      { tags: ['evening'], line: "Day's almost gone." },
      { tags: ['night'], line: "Last call. Speak." },
      { tags: ['monday'], line: "Monday already?" },
      { tags: ['monday'], line: "Week's first cut." },
      { tags: ['friday'], line: "Friday. End it loud." },
      { tags: ['friday'], line: "One more day. Write." },
      { tags: ['weekend'], line: "No deadlines. Spill." },
      { tags: ['weekend'], line: "Weekend brain. Use it." },
    ],
  };

  function aiContext(now = new Date()) {
    const tags = [];
    const h = now.getHours();
    if (h >= 23 || h < 4) tags.push('late-night');
    else if (h < 8) tags.push('early-morning');
    else if (h < 12) tags.push('morning');
    else if (h < 17) tags.push('afternoon');
    else if (h < 21) tags.push('evening');
    else tags.push('night');

    const day = now.getDay();
    if (day === 1) tags.push('monday');
    else if (day === 5) tags.push('friday');
    else if (day === 0 || day === 6) tags.push('weekend');
    else tags.push('midweek');

    return tags;
  }

  function pickByContext(pool, ctx) {
    const matching = pool.filter(p => p.tags.length && p.tags.some(t => ctx.includes(t)));
    const fallback = pool.filter(p => p.tags.length === 0);
    const set = matching.length ? matching : fallback;
    return set[Math.floor(Math.random() * set.length)].line;
  }

  function poolByContext(pool, ctx) {
    const matching = pool.filter(p => p.tags.length && p.tags.some(t => ctx.includes(t)));
    const fallback = pool.filter(p => p.tags.length === 0);
    // Context-tagged lines first so they show on early line indices; defaults
    // round out the pool so any rowPlaceholder index still resolves to a line.
    return [...matching.map(p => p.line), ...fallback.map(p => p.line)];
  }

  const AI = {
    intro: '',
    firstPrompt: '',
    rowPlaceholders: [],
    refresh() {
      const ctx = aiContext();
      this.intro = pickByContext(POOL.intros, ctx);
      this.firstPrompt = pickByContext(POOL.firstPrompts, ctx);
      this.rowPlaceholders = poolByContext(POOL.rowPlaceholders, ctx);
    },
  };
  AI.refresh();

  // ---------------------------------------------------------------------------
  // CRYPTO — AES-GCM-256 with PBKDF2-derived key. 128-bit security level.
  // ---------------------------------------------------------------------------
  async function deriveKey(phrase) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: enc.encode(KEY_SALT),
        iterations: PBKDF2_ITERS,
        hash: 'SHA-256'
      },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function deriveId(phrase) {
    const buf = await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(phrase + ID_SALT)
    );
    return [...new Uint8Array(buf)]
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  async function encryptJSON(cryptoKey, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      cryptoKey,
      new TextEncoder().encode(JSON.stringify(obj))
    );
    const combined = new Uint8Array(iv.length + ciphertext.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ciphertext), iv.length);
    let bin = '';
    for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return btoa(bin);
  }

  async function decryptJSON(cryptoKey, b64) {
    const bin = atob(b64);
    const combined = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) combined[i] = bin.charCodeAt(i);
    const iv = combined.slice(0, 12);
    const data = combined.slice(12);
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      cryptoKey,
      data
    );
    return JSON.parse(new TextDecoder().decode(plaintext));
  }

  // ---------------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------------
  const phraseScreen = document.getElementById('phraseScreen');
  const phraseForm = document.getElementById('phraseForm');
  const phraseInput = document.getElementById('phraseInput');
  const phraseToggle = document.getElementById('phraseToggle');
  const eyeIconOpen = document.getElementById('eyeIconOpen');
  const eyeIconClosed = document.getElementById('eyeIconClosed');
  const phraseError = document.getElementById('phraseError');
  const enterBtn = document.getElementById('enterBtn');
  const aiIntro = document.getElementById('aiIntro');
  const appHeader = document.getElementById('appHeader');
  const appContainer = document.getElementById('appContainer');
  const appFooter = document.getElementById('appFooter');
  const editor = document.getElementById('editor');
  const wordCount = document.getElementById('wordCount');
  const pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const switchBtn = document.getElementById('switchBtn');
  const clearBtn = document.getElementById('clearBtn');
  const syncStatus = document.getElementById('syncStatus');
  const hintEl = document.getElementById('hint');

  aiIntro.textContent = AI.intro;
  try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch {}

  // ---------------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------------
  let cryptoKey = null;
  let phraseId = null;
  let pages = { 1: '' };
  let currentPage = 1;
  let hint = '';
  let pushTimer = null;
  let autoSaveTimer = null;
  let currentGhostEl = null;
  let firstPromptUsed = false;

  // ---------------------------------------------------------------------------
  // CLOUD SYNC
  // ---------------------------------------------------------------------------
  async function pullCloud() {
    if (!cryptoKey || !phraseId) return null;
    const { data, error } = await supabase
      .from('notes')
      .select('encrypted')
      .eq('id', phraseId)
      .maybeSingle();
    if (error) throw new Error(error.message || 'network-error');
    if (!data?.encrypted) return null;
    try {
      return await decryptJSON(cryptoKey, data.encrypted);
    } catch {
      throw new Error('decrypt-fail');
    }
  }

  async function pushCloud() {
    if (!cryptoKey || !phraseId) return;
    setSyncStatus('pending', 'Saving…');
    try {
      const blob = await encryptJSON(cryptoKey, { pages, currentPage, hint });
      const { error } = await supabase.from('notes').upsert({
        id: phraseId,
        encrypted: blob,
        updated_at: new Date().toISOString()
      });
      if (error) {
        setSyncStatus('error', "Cloud's not picking up");
        return;
      }
      setSyncStatus('ok', 'Synced');
    } catch {
      setSyncStatus('error', "Cloud's not picking up");
    }
  }

  function queuePush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushCloud, 1000);
  }

  function setSyncStatus(kind, text) {
    syncStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
    syncStatus.textContent = text || '';
    if (kind === 'ok') {
      const captured = text;
      setTimeout(() => {
        if (syncStatus.textContent === captured) {
          syncStatus.textContent = '';
          syncStatus.className = 'sync-status';
        }
      }, 1500);
    }
  }

  // ---------------------------------------------------------------------------
  // EDITOR / NAVIGATION
  // ---------------------------------------------------------------------------
  // Strip data-placeholder before persisting — the attribute is a runtime hint
  // for the ghost-text CSS, not part of the user's content.
  function cleanForSave(html) {
    return (html || '').replace(/\s*data-placeholder="[^"]*"/g, '');
  }

  function reloadEditor() {
    if (!pages[currentPage]) {
      const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
      currentPage = nums[0] || 1;
      if (!pages[currentPage]) pages[currentPage] = '';
    }
    editor.innerHTML = DOMPurify.sanitize(pages[currentPage] || '');
    updateWordCount();
    updateUI();
    updateGhost();
  }

  function loadPage(page) {
    pages[currentPage] = cleanForSave(editor.innerHTML);
    Object.keys(pages).forEach(p => {
      const n = parseInt(p);
      if (n > 1 && (!pages[p] || pages[p].trim() === '')) delete pages[p];
    });
    currentPage = page;
    editor.innerHTML = DOMPurify.sanitize(pages[currentPage] || '');
    updateWordCount();
    updateGhost();
  }

  function updateUI() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    pageInfo.textContent = `${currentPage} / ${nums.length}`;
    prevBtn.disabled = nums.indexOf(currentPage) <= 0;
  }

  function nextPage() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    const idx = nums.indexOf(currentPage);
    if (idx < nums.length - 1) {
      savePage();
      loadPage(nums[idx + 1]);
    } else {
      const newPage = (nums.length ? Math.max(...nums) : 0) + 1;
      pages[newPage] = '';
      savePage();
      loadPage(newPage);
    }
    updateUI();
    editor.focus();
  }

  function prevPage() {
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    const idx = nums.indexOf(currentPage);
    if (idx > 0) {
      savePage();
      loadPage(nums[idx - 1]);
      updateUI();
      editor.focus();
    }
  }

  function clearPage() {
    if (editor.innerHTML && confirm('Wipe this page? No undo.')) {
      editor.innerHTML = '';
      savePage();
      updateWordCount();
      updateGhost();
    }
  }

  function savePage() {
    pages[currentPage] = cleanForSave(editor.innerHTML);
    queuePush();
  }

  function updateWordCount() {
    const text = editor.textContent.trim();
    const words = text ? text.split(/\s+/).length : 0;
    wordCount.textContent = words + (words === 1 ? ' word' : ' words');
  }

  // ---------------------------------------------------------------------------
  // GHOST PLACEHOLDER — sets data-placeholder on the empty block at the cursor.
  // CSS handles rendering; data-placeholder is stripped before persistence.
  // ---------------------------------------------------------------------------
  function clearGhost() {
    if (currentGhostEl) {
      currentGhostEl.removeAttribute('data-placeholder');
      currentGhostEl = null;
    }
    editor.removeAttribute('data-placeholder');
  }

  function blockIsEmpty(el) {
    if (!el) return false;
    if (el.textContent && el.textContent.length > 0) return false;
    // Allow a single <br> (browser-inserted on Enter) but no other children.
    for (const child of el.children) {
      if (child.tagName !== 'BR') return false;
    }
    return true;
  }

  function findCurrentBlock() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    let node = sel.anchorNode;
    if (!node) return null;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
    while (node && node !== editor && node.parentNode !== editor) {
      node = node.parentNode;
    }
    if (node === editor || !node) return null;
    return node;
  }

  function ghostCopyForLine(blockEl) {
    const editorIsEmpty = !editor.textContent || editor.textContent.length === 0;
    if (editorIsEmpty && !firstPromptUsed) {
      return AI.firstPrompt;
    }
    let lineIndex = 0;
    if (blockEl && blockEl.parentNode === editor) {
      lineIndex = Array.prototype.indexOf.call(editor.children, blockEl);
    }
    return AI.rowPlaceholders[lineIndex % AI.rowPlaceholders.length];
  }

  function updateGhost() {
    clearGhost();
    if (!cryptoKey) return;
    if (document.activeElement !== editor) {
      // When unfocused, still show a ghost on a wholly-empty editor so the
      // user sees the prompt before they click in.
      if (!editor.textContent || editor.textContent.length === 0) {
        if (editor.children.length === 0) {
          editor.setAttribute('data-placeholder', ghostCopyForLine(null));
        }
      }
      return;
    }
    const block = findCurrentBlock();
    if (block && blockIsEmpty(block)) {
      block.setAttribute('data-placeholder', ghostCopyForLine(block));
      currentGhostEl = block;
    } else if (!block && editor.children.length === 0 &&
               (!editor.textContent || editor.textContent.length === 0)) {
      // No nested blocks yet — the editor itself is the empty line.
      editor.setAttribute('data-placeholder', ghostCopyForLine(null));
    }
  }

  // ---------------------------------------------------------------------------
  // ENTER / LOCK
  // ---------------------------------------------------------------------------
  async function enter(phrase) {
    phraseError.textContent = '';
    enterBtn.disabled = true;
    enterBtn.textContent = 'Working…';

    try {
      cryptoKey = await deriveKey(phrase);
      phraseId = await deriveId(phrase);

      let cloud = null;
      try {
        cloud = await pullCloud();
      } catch (e) {
        if (e.message !== 'decrypt-fail') {
          phraseError.textContent = "Couldn't reach server. Try again.";
          cryptoKey = null;
          phraseId = null;
          return;
        }
        // decrypt-fail: phrase typo or rare hash collision. Proceed as fresh user;
        // first pushCloud() will overwrite the unreadable blob.
      }

      if (cloud) {
        pages = cloud.pages || { 1: '' };
        currentPage = cloud.currentPage || 1;
        hint = cloud.hint || '';
      } else {
        pages = { 1: '' };
        currentPage = 1;
        hint = '';
      }

      phraseScreen.hidden = true;
      appHeader.hidden = false;
      appContainer.hidden = false;
      appFooter.hidden = false;
      firstPromptUsed = false;
      AI.refresh();
      reloadEditor();
      hintEl.textContent = hint;
      editor.focus();
      updateGhost();
    } catch (e) {
      phraseError.textContent = "That's not it. Try again.";
      cryptoKey = null;
      phraseId = null;
    } finally {
      enterBtn.disabled = false;
      enterBtn.textContent = 'Enter';
    }
  }

  async function switchNotepad() {
    if (cryptoKey) {
      clearTimeout(autoSaveTimer);
      clearTimeout(pushTimer);
      pages[currentPage] = cleanForSave(editor.innerHTML);
      hint = (hintEl.textContent || '').trim().slice(0, 120);
      try { await pushCloud(); } catch {}
    }
    cryptoKey = null;
    phraseId = null;
    pages = { 1: '' };
    currentPage = 1;
    hint = '';
    hintEl.textContent = '';
    appHeader.hidden = true;
    appContainer.hidden = true;
    appFooter.hidden = true;
    phraseScreen.hidden = false;
    AI.refresh();
    aiIntro.textContent = AI.intro;
    phraseInput.value = '';
    phraseError.textContent = '';
    setTimeout(() => phraseInput.focus(), 0);
  }

  // ---------------------------------------------------------------------------
  // WIRING
  // ---------------------------------------------------------------------------
  phraseForm.addEventListener('submit', e => {
    e.preventDefault();
    const phrase = phraseInput.value;
    if (!phrase) return;
    enter(phrase);
  });

  phraseToggle.addEventListener('click', () => {
    const masking = phraseInput.type === 'text';
    phraseInput.type = masking ? 'password' : 'text';
    // SVG elements don't reflect .hidden as an IDL property in all browsers,
    // so toggle the attribute directly — the CSS rule [hidden] hides them.
    eyeIconOpen.toggleAttribute('hidden', masking);
    eyeIconClosed.toggleAttribute('hidden', !masking);
    phraseToggle.setAttribute('aria-label', masking ? 'Show phrase' : 'Hide phrase');
    phraseInput.focus();
  });

  prevBtn.addEventListener('click', prevPage);
  nextBtn.addEventListener('click', nextPage);
  clearBtn.addEventListener('click', clearPage);
  switchBtn.addEventListener('click', switchNotepad);

  editor.addEventListener('input', () => {
    if (editor.textContent && editor.textContent.length > 0) firstPromptUsed = true;
    updateWordCount();
    updateGhost();
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(savePage, 1000);
  });

  editor.addEventListener('focus', updateGhost);
  editor.addEventListener('blur', clearGhost);
  document.addEventListener('selectionchange', () => {
    if (document.activeElement === editor) updateGhost();
  });

  function saveHint() {
    hint = (hintEl.textContent || '').trim().slice(0, 120);
    queuePush();
  }

  hintEl.addEventListener('input', () => {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(saveHint, 1000);
  });

  hintEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); hintEl.blur(); }
  });

  hintEl.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text.replace(/[\r\n]+/g, ' '));
  });

  document.addEventListener('keydown', e => {
    if (!cryptoKey) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  });

  let touchStart = 0;
  editor.addEventListener('touchstart', e => { touchStart = e.touches[0].clientX; });
  editor.addEventListener('touchend', e => {
    const end = e.changedTouches[0].clientX;
    if (touchStart - end > 50) nextPage();
    if (end - touchStart > 50) prevPage();
  });

  window.addEventListener('online', () => { if (cryptoKey) queuePush(); });
</script>

</body>
</html>
